name: MAX Sync

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install sync dependencies
        run: npm ci --prefix scripts/max-sync

      - name: Install Camoufox browser
        run: npm run prepare-browser --prefix scripts/max-sync

      - name: Run MAX sync
        run: npm run sync --prefix scripts/max-sync
        env:
          NODE_ENV: production
          MAX_USERNAME: ${{ secrets.MAX_USERNAME }}
          MAX_PASSWORD: ${{ secrets.MAX_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SYNC_USER_UID: ${{ secrets.SYNC_USER_UID }}
          SYNC_BOOK_ID: ${{ secrets.SYNC_BOOK_ID }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
